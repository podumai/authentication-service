name: CI/CD Pipeline

on:
  push:
    branches: [ 'feature/*', 'fix/*', 'dev', 'master' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/**'

  pull_request:
    branches: [ 'dev', 'master' ]
    types: [ opened, synchronize, reopened, closed ]

env:
  GO_VERSION: 1.25.6
  APP_NAME: authentication-service
  GHCR_OWNER: ${{ github.repository_owner }}

jobs:
  quick-check:
    name: 🔍 Quick Check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Quick lint
        uses: golangci/golangci-lint-action@v3
        with:
          only-new-issues: true
          args: --fast

      - name: Quick tests
        run: go test -short ./...

  pr-check:
    name: 🔍 PR Validation
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install protoc
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate protobuf
        run: make deps

      - name: Check git diff (generated files should be committed)
        run: |
          if [[ -n $(git status -s) ]]; then
            echo "❌ Generated files are not committed!"
            git status
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m --out-format=colored-line-number
          only-new-issues: true

      - name: Run tests with coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.txt
          flags: pr-${{ github.event.number }}

      - name: Comment PR with coverage
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./coverage.txt

  pr-required-checks:
    name: ✅ Required Checks
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    needs: [pr-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?: ]]; then
            echo "❌ PR title must follow conventional commits format"
            exit 1
          fi

      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|hotfix)/ ]]; then
            echo "❌ Branch name must start with feature/, fix/, or hotfix/"
            exit 1
          fi

  pr-build:
    name: 🐳 Build PR Image
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'master')
    needs: [pr-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:pr-${{ github.event.number }}
          labels: |
            pr=${{ github.event.number }}
            commit=${{ github.sha }}

      - name: Comment PR with image info
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const comment = `
            ✅ **PR #${prNumber} built successfully!**
            
            Image: \`ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:pr-${prNumber}\`
            Commit: ${context.sha}
            
            You can test this image with:
            \`\`\`bash
            docker pull ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:pr-${prNumber}
            \`\`\`
            `;
            
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  dev-merge:
    name: 🚀 DEV Post-Merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [pr-check, pr-required-checks, pr-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: development
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:dev-latest
            ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:dev-${{ github.sha }}

  master-pr-check:
    name: 🎯 Master pull request check
    if: github.event_name == 'pull_request' && github.base_ref == 'refs/heads/master' && github.head_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Cloning repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Run full test suite
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
          go test -bench=. ./...
      
      - name: Run security checks
        run: |
          go vet ./...
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
      
      - name: Check version bump
        run: |
          git fetch origin dev:dev
          DEV_VERSION=$(git show dev:VERSION 2>/dev/null || echo "none")
          CURRENT_VERSION=$(cat VERSION 2>/dev/null || echo "none")
          
          if [ "$DEV_VERSION" = "none" ] || [ "$CURRENT_VERSION" = "none" ]; then
            echo "⚠️ Version files not found, skipping version check"
          elif [ "$DEV_VERSION" = "$CURRENT_VERSION" ]; then
            echo "❌ Version must be increased for master release"
            exit 1
          fi
    
  master-release:
    name: 🎯 Master Release
    if: github.event_name == 'pull_request' && github.base_ref == 'master' && github.head_ref == 'dev' && github.event.pull_request.merged == true
    needs: [master-pr-check, pr-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    
    steps:
      - name: Cloning repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: get_version
        run: |
          if [ -f VERSION ]; then
            VERSION=$(cat VERSION)
          else
            VERSION="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build production binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/${{ env.APP_NAME }}-linux-amd64 ./cmd/app
          GOOS=darwin GOARCH=amd64 go build -o dist/${{ env.APP_NAME }}-darwin-amd64 ./cmd/app
          GOOS=windows GOARCH=amd64 go build -o dist/${{ env.APP_NAME }}-windows-amd64.exe ./cmd/app
          tar -czf dist/${{ env.APP_NAME }}-${{ steps.get_version.outputs.release_version }}.tar.gz dist/

      - name: Build and push production Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: production
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:latest
            ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:${{ steps.get_version.outputs.release_version }}
            ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:${{ github.sha }}
          labels: |
            version=${{ steps.get_version.outputs.release_version }}
            commit=${{ github.sha }}
            date=${{ github.event.pull_request.merged_at }}

      - name: Create Git tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a ${{ steps.get_version.outputs.version }} -m "Release ${{ steps.get_version.outputs.version }}"
          git push origin ${{ steps.get_version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## 🚀 Release ${{ steps.get_version.outputs.version }}
            
            ### 📦 What's Changed
            ${{ github.event.pull_request.body }}
            
            ### 🔍 PR Details
            - **PR:** #${{ github.event.pull_request.number }}
            - **Author:** @${{ github.event.pull_request.user.login }}
            - **Merged by:** @${{ github.event.pull_request.merged_by.login }}
            - **Commits:** ${{ github.event.pull_request.commits }}
            - **Files changed:** ${{ github.event.pull_request.changed_files }}
            
            ### 📦 Artifacts
            - Docker image: `ghcr.io/${{ env.GHCR_OWNER }}/${{ env.APP_NAME }}:${{ steps.get_version.outputs.release_version }}`
            - Binaries attached to this release
            
            ### 📝 Full Changelog
            https://github.com/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.merge_commit_sha }}
          files: |
            dist/${{ env.APP_NAME }}-${{ steps.get_version.outputs.release_version }}.tar.gz
            dist/${{ env.APP_NAME }}-linux-amd64
            dist/${{ env.APP_NAME }}-darwin-amd64
            dist/${{ env.APP_NAME }}-windows-amd64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}